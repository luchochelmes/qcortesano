<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<style>
  html, body { margin: 0; padding: 0; background: #0a0a0a; }
  body { font-family: 'Work Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  a { color: #f2f2ee; text-decoration: none; }
  a:hover { color: #ffffff; }
  ::selection { background: #9fb7a4; color: #0a0a0a; }

  /* Accent: #9fb7a4 para estados seleccionados */
  .accent-bg   { background: #9fb7a4 !important; }
  .accent-border { border-color: #9fb7a4 !important; }
  .accent-fg   { color: #0a0a0a !important; }

  /* Login */
  .login-btn { display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #f2f2ee; font-family: inherit; cursor: pointer; padding: 22px 24px; border-radius: 6px; text-align: left; transition: border-color .2s, background .2s; }
  .login-btn:hover { border-color: #f2f2ee; background: rgba(255,255,255,0.05); }

  /* Tabs */
  .tab-btn { flex: 1; font-family: inherit; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 600; padding: 12px 10px; border-radius: 999px; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); background: transparent; color: rgba(242,242,238,0.7); transition: .2s; }
  .tab-btn.active { background: #9fb7a4; color: #0a0a0a; border-color: #9fb7a4; }

  /* Week nav */
  .nav-arrow { width: 40px; height: 40px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.25); background: transparent; color: #f2f2ee; cursor: pointer; font-size: 15px; transition: .2s; }
  .nav-arrow:hover { background: #f2f2ee; color: #0a0a0a; }

  /* Paint toggle */
  .paint-btn { font-family: inherit; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 600; padding: 13px 20px; border-radius: 999px; cursor: pointer; border: 1px solid rgba(255,255,255,0.25); background: transparent; color: #f2f2ee; transition: .2s; }
  .paint-btn.active { background: #9fb7a4; color: #0a0a0a; border-color: #9fb7a4; }

  /* Calendar grid */
  .cal-grid { border: 1px solid rgba(255,255,255,0.14); border-radius: 6px; overflow: hidden; }
  .cal-head-cell { padding: 10px 4px; text-align: center; border-left: 1px solid rgba(255,255,255,0.09); }
  .cal-row { display: grid; grid-template-columns: 56px repeat(5,1fr); border-bottom: 1px solid rgba(255,255,255,0.06); }
  .cal-time { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; color: rgba(242,242,238,0.4); display: flex; align-items: center; justify-content: center; padding: 2px; }
  .cal-cell { border: none; border-left: 1px solid rgba(255,255,255,0.09); height: 26px; padding: 0 4px; cursor: pointer; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; letter-spacing: 0.04em; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; text-align: left; transition: opacity .1s; }
  .cal-cell:hover { opacity: 0.8; }

  /* Detail panel */
  .detail-panel { border: 1px solid #9fb7a4; border-radius: 6px; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
  .detail-wa { border: 1px solid rgba(255,255,255,0.3); padding: 12px 20px; border-radius: 999px; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; transition: .2s; }
  .detail-wa:hover { background: #f2f2ee; color: #0a0a0a; }
  .btn-text-danger { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: rgba(242,242,238,0.6); font-family: inherit; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; padding: 12px 20px; border-radius: 999px; cursor: pointer; transition: color .2s; }
  .btn-text-danger:hover { color: #f2f2ee; }
  .btn-ghost-sm { background: transparent; border: none; color: rgba(242,242,238,0.4); font-family: inherit; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; padding: 12px 6px; cursor: pointer; transition: color .2s; }
  .btn-ghost-sm:hover { color: #f2f2ee; }

  /* Appointment cards */
  .appt-card { border: 1px solid rgba(255,255,255,0.14); border-radius: 6px; padding: 20px; display: flex; flex-direction: column; gap: 14px; transition: opacity .2s; }
  .badge { font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 600; padding: 7px 12px; border-radius: 999px; white-space: nowrap; }
  .btn-pill { background: transparent; border: 1px solid rgba(255,255,255,0.25); color: #f2f2ee; font-family: inherit; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; padding: 11px 18px; border-radius: 999px; cursor: pointer; transition: .2s; }
  .btn-pill:hover { background: #f2f2ee; color: #0a0a0a; }
  .btn-pill-faint { background: transparent; border: 1px solid rgba(255,255,255,0.14); color: rgba(242,242,238,0.5); font-family: inherit; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; padding: 11px 18px; border-radius: 999px; cursor: pointer; transition: color .2s; }
  .btn-pill-faint:hover { color: #f2f2ee; }

  .wa-link:hover { background: #f2f2ee; color: #0a0a0a; }

  .manual-form { border: 1px dashed rgba(255,255,255,0.2); border-radius: 6px; padding: 22px; display: flex; flex-direction: column; gap: 14px; }

  .alert-chip { flex-shrink:0; display:flex; align-items:center; gap:10px; background:rgba(196,169,107,0.08); border:1px solid rgba(196,169,107,0.28); border-radius:6px; padding:10px 14px; }

  .day-chip.selected { background:#f2f2ee; color:#0a0a0a; border-color:#f2f2ee; }

  .day-dot { width:5px; height:5px; border-radius:50%; margin-top:2px; }

</style>

<script>
const DAYS   = ['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'];
const MONTHS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

// Horario base Valen: mar–mié 10–13 y 16–20, jue–sáb 10–20 (en minutos desde medianoche)
const VALEN = { 2:[[600,780],[960,1200]], 3:[[600,780],[960,1200]], 4:[[600,1200]], 5:[[600,1200]], 6:[[600,1200]] };

function hhmm(m){ const h = Math.floor(m/60), mm = m%60; return (h<10?'0':'')+h+':'+(mm<10?'0':'')+mm; }
function cellKey(dayIdx, min){ return dayIdx + '|' + min; }

// Estado global
const S = {
  user: null,         // 'valen' | 'alex'
  tab: 'cal',
  week: 0,
  paint: false,
  detail: null,       // appt id
  // Alex empieza sin horarios; se pintan manualmente
  alexOpen: {},
  blocked: {},
  dayIdx: 1,
  appts: [],
  fbBookings: [],
  newName: '', newPhone: '', newWhen: ''
};

const FB_URL = 'https://qcortesano-9aa75-default-rtdb.firebaseio.com/bookings.json';

function computedFbAppts() {
  const start = weekStart();
  return S.fbBookings.map(b => {
    const parts = b.isoDate.split('-').map(Number);
    const bd = new Date(parts[0], parts[1] - 1, parts[2]);
    const day = Math.round((bd - start) / 864e5);
    return { ...b, day, owner: b.barber };
  }).filter(b => b.day >= 1 && b.day <= 5);
}

function allAppts() { return [...S.appts, ...computedFbAppts()]; }

function loadFirebaseBookings() {
  fetch(FB_URL)
    .then(r => r.json())
    .then(data => {
      if (!data) { S.fbBookings = []; }
      else { S.fbBookings = Object.values(data).filter(b => b && b.status !== 'cancelado'); }
      if (S.user) render();
    })
    .catch(() => {});
}

function weekStart() {
  const d = new Date();
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + S.week * 7);
  return d;
}

function isOpen(dayIdx, dow, min) {
  const wk = String(S.week);
  if (S.user === 'valen') {
    if ((S.blocked[wk] || {})[cellKey(dayIdx, min)]) return false;
    return (VALEN[dow] || []).some(r => min >= r[0] && min < r[1]);
  }
  return !!((S.alexOpen[wk] || {})[cellKey(dayIdx, min)]);
}

function toggleCell(dayIdx, min) {
  const wk = String(S.week);
  if (S.user === 'alex') {
    const map = Object.assign({}, S.alexOpen[wk] || {});
    const k = cellKey(dayIdx, min);
    if (map[k]) delete map[k]; else map[k] = 1;
    S.alexOpen[wk] = map;
  } else {
    const map = Object.assign({}, S.blocked[wk] || {});
    const k = cellKey(dayIdx, min);
    if (map[k]) delete map[k]; else map[k] = 1;
    S.blocked[wk] = map;
  }
}

// ── LOGIN / LOGOUT ──────────────────────────────────────────────
function login(user) {
  S.user  = user;
  S.tab   = 'cal';
  S.paint = user === 'alex'; // Alex arranca en modo pintura
  S.detail = null;
  S.week  = 0;
  document.getElementById('view-login').style.display = 'none';
  const dash = document.getElementById('view-dash');
  dash.style.display = 'flex';
  loadFirebaseBookings();
  if (!S._poll) S._poll = setInterval(loadFirebaseBookings, 30000);
  render();
}

function logout() {
  S.user  = null;
  S.detail = null;
  document.getElementById('view-dash').style.display = 'none';
  document.getElementById('view-login').style.display = 'flex';
}

// ── TABS ────────────────────────────────────────────────────────
function setTab(tab) {
  S.tab = tab;
  S.detail = null;
  document.getElementById('tab-cal').classList.toggle('active', tab === 'cal');
  document.getElementById('tab-list').classList.toggle('active', tab === 'list');
  document.getElementById('view-cal').style.display  = tab === 'cal'  ? 'flex'  : 'none';
  document.getElementById('view-list').style.display = tab === 'list' ? 'flex'  : 'none';
  render();
}

// ── WEEK NAV ────────────────────────────────────────────────────
function weekOffset(d) {
  S.week  += d;
  S.detail = null;
  render();
}

// ── PAINT ───────────────────────────────────────────────────────
function togglePaint() { S.paint = !S.paint; render(); }

// ── MANUAL FORM ─────────────────────────────────────────────────
function addAppt() {
  const name = document.getElementById('new-name').value.trim();
  if (!name) return;
  const phone = document.getElementById('new-phone').value.trim() || 'sin número';
  const when  = document.getElementById('new-when').value.trim()  || 'Corte de pelo · 30 min';
  S.appts.push({ id: Date.now(), day:2, min:660, dur:30, name, phone, service: when, owner: S.user, status:'manual' });
  document.getElementById('new-name').value  = '';
  document.getElementById('new-phone').value = '';
  document.getElementById('new-when').value  = '';
  render();
}

// ── APPOINTMENT ACTIONS ──────────────────────────────────────────
function toggleStatus(id) {
  const a = S.appts.find(x => x.id === id);
  if (!a) return;
  a.status = a.status === 'manual' ? 'online' : 'manual';
  render();
}
function cancelAppt(id) {
  const a = S.appts.find(x => x.id === id);
  if (!a) return;
  a.status = a.status === 'cancelado' ? 'online' : 'cancelado';
  render();
}
function cancelFromDetail() {
  if (!S.detail) return;
  cancelAppt(S.detail);
  S.detail = null;
  render();
}
function closeDetail() { S.detail = null; renderCalendar(); renderDetail(); }

// ── RENDER ───────────────────────────────────────────────────────
function render() {
  const isAlex = S.user === 'alex';

  // Header
  document.getElementById('hdr-name').textContent = isAlex ? 'Alex' : 'Valen';
  document.getElementById('hdr-role').textContent = isAlex ? 'Peluquero part-time' : 'Fundador';

  // Paint button
  const pb = document.getElementById('paint-btn');
  pb.textContent = isAlex
    ? (S.paint ? 'Pintando disponibilidad' : 'Pintar disponibilidad')
    : (S.paint ? 'Bloqueando horarios' : 'Bloquear horarios');
  pb.classList.toggle('active', S.paint);

  // Help text
  document.getElementById('help-text').textContent = isAlex
    ? 'Arrancás la semana sin horarios. Activá el modo y tocá los bloques de 15 minutos en los que vas a estar. Se publican al instante para los clientes.'
    : 'Tu horario base está cargado (mar–mié 10–13 y 16–20, jue–sáb 10–20). Activá el modo y tocá un bloque para bloquearlo por feriado o imprevisto.';

  // Week label
  const start = weekStart();
  document.getElementById('week-label').textContent = 'Semana del ' + start.getDate() + ' ' + MONTHS[start.getMonth()];

  renderAlerts();
  renderCalendar();
  renderDetail();
  renderList();
  renderStatusBar();
}

// Umbral: días con 3 o menos cupos libres disparan la alerta
const LOW_THRESHOLD = 3;

function renderAlerts() {
  const wrap  = document.getElementById('low-alert');
  const chips = document.getElementById('low-alert-chips');
  const start = weekStart();
  const mine  = allAppts().filter(a => a.owner === S.user && a.status !== 'cancelado');

  const lowDays = [];
  for (let i = 1; i <= 5; i++) {
    const d   = new Date(start); d.setDate(d.getDate() + i);
    const dow = d.getDay();
    let free = 0;
    for (let m = 600; m < 1200; m += 30) {
      const hasAppt = mine.some(a => a.day === i && m >= a.min && m < a.min + a.dur);
      if (!hasAppt && isOpen(i, dow, m)) free++;
    }
    if (free > 0 && free <= LOW_THRESHOLD) {
      lowDays.push({ label: DAYS[dow] + ' ' + d.getDate(), free });
    }
  }

  if (lowDays.length === 0) { wrap.style.display = 'none'; return; }

  wrap.style.display = 'flex';
  chips.innerHTML = lowDays.map(({ label, free }) => `
    <div class="alert-chip">
      <span class="alert-chip-day">${label}</span>
      <span class="alert-chip-count">${free} libre${free === 1 ? '' : 's'}</span>
    </div>`).join('');
}

function selectAdminDay(i) {
  S.dayIdx = i;
  S.detail = null;
  renderCalendar();
  renderDetail();
}

function renderCalendar() {
  const start = weekStart();
  const mine  = allAppts().filter(a => a.owner === S.user && a.status !== 'cancelado');

  // ── Day chips ──
  const daysEl = document.getElementById('admin-days');
  const days = [];
  for (let i = 1; i <= 5; i++) {
    const d = new Date(start); d.setDate(d.getDate() + i);
    days.push({ i, d, dow: d.getDay() });
  }
  daysEl.innerHTML = days.map(({ i, d, dow }) => {
    const on      = S.dayIdx === i;
    const hasAppt = mine.some(a => a.day === i);
    const dotColor = on ? '#0a0a0a' : '#9fb7a4';
    return `<button class="day-chip${on ? ' selected' : ''}" onclick="selectAdminDay(${i})">
      <span class="day-chip-name">${DAYS[dow]}</span>
      <span class="day-chip-date">${d.getDate()}</span>
      <span class="day-dot" style="background:${hasAppt ? dotColor : 'transparent'}"></span>
    </button>`;
  }).join('');

  // ── Slots for selected day ──
  const slotsEl = document.getElementById('admin-slots');
  const sel = days.find(x => x.i === S.dayIdx);
  if (!sel) { slotsEl.innerHTML = ''; return; }

  let html = '';
  for (let m = 600; m < 1200; m += 30) {
    const open = isOpen(S.dayIdx, sel.dow, m);
    const appt = mine.find(a => a.day === S.dayIdx && m >= a.min && m < a.min + a.dur);
    const isFirstSlot = appt && m === appt.min;

    if (appt) {
      html += `<button class="admin-slot admin-slot-booked" onclick="slotClick(${S.dayIdx},${m})">
        <span class="admin-slot-time">${hhmm(m)}</span>
        <span class="admin-slot-label">${isFirstSlot ? appt.name : '·'}</span>
        ${isFirstSlot ? `<span class="admin-slot-sub">${appt.service.split('·')[0].trim()}</span>` : ''}
      </button>`;
    } else if (open) {
      html += `<button class="admin-slot admin-slot-free" onclick="slotClick(${S.dayIdx},${m})">
        <span class="admin-slot-time">${hhmm(m)}</span>
        <span class="admin-slot-label">Libre</span>
        ${S.paint ? '<span class="admin-slot-sub" style="color:rgba(242,242,238,0.3)">toca para bloquear</span>' : ''}
      </button>`;
    } else {
      html += `<button class="admin-slot admin-slot-closed" disabled>
        <span class="admin-slot-time">${hhmm(m)}</span>
        <span class="admin-slot-label" style="color:rgba(242,242,238,0.3)">Cerrado</span>
        ${S.paint && S.user === 'alex' ? '<span class="admin-slot-sub" style="color:rgba(242,242,238,0.3)">toca para abrir</span>' : ''}
      </button>`;
    }
  }
  slotsEl.innerHTML = html;

  // Re-attach click handlers for paint on closed slots (Alex only)
  if (S.paint && S.user === 'alex') {
    slotsEl.querySelectorAll('.admin-slot-closed').forEach(btn => {
      btn.disabled = false;
      const parts = btn.querySelector('.admin-slot-time').textContent.split(':');
      const m = parseInt(parts[0]) * 60 + parseInt(parts[1]);
      btn.onclick = () => slotClick(S.dayIdx, m);
    });
  }
}

function slotClick(dayIdx, m) {
  const mine = allAppts().filter(a => a.owner === S.user && a.status !== 'cancelado');
  const appt = mine.find(a => a.day === dayIdx && m >= a.min && m < a.min + a.dur);
  if (appt) { S.detail = appt.id; renderDetail(); return; }
  if (S.paint) { toggleCell(dayIdx, m); renderCalendar(); }
}

function renderDetail() {
  const panel = document.getElementById('detail-panel');
  if (!S.detail) { panel.style.display = 'none'; return; }
  const appt  = allAppts().find(a => a.id === S.detail);
  if (!appt)   { panel.style.display = 'none'; return; }

  const start = weekStart();
  const d = new Date(start); d.setDate(d.getDate() + appt.day);
  const when = DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' · ' + hhmm(appt.min);
  const wa   = 'https://wa.me/54' + appt.phone.replace(/\s/g, '');

  panel.style.display = 'flex';
  panel.className = 'detail-panel';
  panel.style.flexDirection = 'column';
  panel.style.gap = '12px';
  panel.innerHTML = `
    <span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9px;letter-spacing:0.2em;color:rgba(242,242,238,0.5);text-transform:uppercase">${when}</span>
    <span style="font-family:'Bebas Neue',sans-serif;font-size:34px;line-height:1;letter-spacing:0.03em">${appt.name}</span>
    <span style="font-size:14px;color:rgba(242,242,238,0.7)">${appt.service}</span>
    <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:8px">
      <a href="${wa}" target="_blank" class="detail-wa">${appt.phone}</a>
      <button class="btn-text-danger" onclick="cancelFromDetail()">Cancelar turno</button>
      <button class="btn-ghost-sm" onclick="closeDetail()">Cerrar</button>
    </div>`;
}

function renderList() {
  const start = weekStart();
  const mine  = allAppts().filter(a => a.owner === S.user);
  const active = mine.filter(a => a.status !== 'cancelado').length;

  document.getElementById('count-label').textContent = active + (active === 1 ? ' activo' : ' activos');

  const list = document.getElementById('appt-list');
  list.innerHTML = '';
  list.style.display = 'flex';
  list.style.flexDirection = 'column';
  list.style.gap = '12px';

  mine.forEach(appt => {
    const d = new Date(start); d.setDate(d.getDate() + appt.day);
    const cancelled = appt.status === 'cancelado';
    const st = cancelled ? 'Cancelado' : appt.status === 'manual' ? 'Manual' : 'Online';
    const wa = 'https://wa.me/54' + appt.phone.replace(/\s/g, '');
    const when = DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' · ' + hhmm(appt.min);

    let badgeBorder = cancelled ? 'rgba(255,255,255,0.2)' : '#9fb7a4';
    let badgeBg     = cancelled ? 'transparent' : (appt.status === 'manual' ? 'transparent' : '#9fb7a4');
    let badgeFg     = cancelled ? 'rgba(242,242,238,0.5)' : (appt.status === 'manual' ? '#f2f2ee' : '#0a0a0a');

    const card = document.createElement('div');
    card.className = 'appt-card';
    card.style.opacity = cancelled ? '0.45' : '1';
    card.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px">
        <div style="display:flex;flex-direction:column;gap:5px">
          <span style="font-family:'Bebas Neue',sans-serif;font-size:30px;line-height:1;letter-spacing:0.03em;text-decoration:${cancelled?'line-through':'none'}">${appt.name}</span>
          <span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;letter-spacing:0.14em;color:rgba(242,242,238,0.5)">${when}</span>
        </div>
        <span class="badge" style="border:1px solid ${badgeBorder};background:${badgeBg};color:${badgeFg}">${st}</span>
      </div>
      <span style="font-size:13px;color:rgba(242,242,238,0.6)">${appt.service}</span>
      <div style="display:flex;flex-wrap:wrap;gap:9px">
        <a href="${wa}" target="_blank" class="wa-link">${appt.phone}</a>
        <button class="btn-pill" onclick="toggleStatus(${appt.id})">${appt.status === 'manual' ? 'Marcar online' : 'Marcar manual'}</button>
        <button class="btn-pill-faint" onclick="cancelAppt(${appt.id})">${cancelled ? 'Restaurar' : 'Cancelar'}</button>
      </div>`;
    list.appendChild(card);
  });
}

function renderStatusBar() {
  const active = allAppts().filter(a => a.owner === S.user && a.status !== 'cancelado').length;
  document.getElementById('status-bar').textContent =
    active + (active === 1 ? ' turno esta semana' : ' turnos esta semana') + ' · cambios visibles al instante para los clientes';
}

// ── PASSWORD ────────────────────────────────────────────────────
function checkPassword() {
  const val = document.getElementById('pwd-input').value;
  const err = document.getElementById('pwd-error');
  if (val === atob('VmFsZW5zYW5vMTA=')) {
    document.getElementById('view-password').style.display = 'none';
    document.getElementById('view-login').style.display = 'flex';
    err.style.display = 'none';
  } else {
    err.style.display = 'block';
    document.getElementById('pwd-input').value = '';
    document.getElementById('pwd-input').focus();
  }
}
// Asegurar que la vista lista empiece oculta
document.getElementById('view-list').style.display = 'none';
document.getElementById('view-cal').style.display  = 'flex';
</script>
