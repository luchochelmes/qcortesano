<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QCortesano — Panel de turnos</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #0a0a0a; }
  body { font-family: 'Work Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  a { color: #f2f2ee; text-decoration: none; }
  a:hover { color: #ffffff; }
  ::selection { background: #9fb7a4; color: #0a0a0a; }

  /* Accent: #9fb7a4 para estados seleccionados */
  .accent-bg   { background: #9fb7a4 !important; }
  .accent-border { border-color: #9fb7a4 !important; }
  .accent-fg   { color: #0a0a0a !important; }

  /* Login */
  .login-btn { display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #f2f2ee; font-family: inherit; cursor: pointer; padding: 22px 24px; border-radius: 6px; text-align: left; transition: border-color .2s, background .2s; }
  .login-btn:hover { border-color: #f2f2ee; background: rgba(255,255,255,0.05); }

  /* Tabs */
  .tab-btn { flex: 1; font-family: inherit; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 600; padding: 12px 10px; border-radius: 999px; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); background: transparent; color: rgba(242,242,238,0.7); transition: .2s; }
  .tab-btn.active { background: #9fb7a4; color: #0a0a0a; border-color: #9fb7a4; }

  /* Week nav */
  .nav-arrow { width: 40px; height: 40px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.25); background: transparent; color: #f2f2ee; cursor: pointer; font-size: 15px; transition: .2s; }
  .nav-arrow:hover { background: #f2f2ee; color: #0a0a0a; }

  /* Paint toggle */
  .paint-btn { font-family: inherit; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 600; padding: 13px 20px; border-radius: 999px; cursor: pointer; border: 1px solid rgba(255,255,255,0.25); background: transparent; color: #f2f2ee; transition: .2s; }
  .paint-btn.active { background: #9fb7a4; color: #0a0a0a; border-color: #9fb7a4; }

  /* Calendar grid */
  .cal-grid { border: 1px solid rgba(255,255,255,0.14); border-radius: 6px; overflow: hidden; }
  .cal-head-cell { padding: 10px 4px; text-align: center; border-left: 1px solid rgba(255,255,255,0.09); }
  .cal-row { display: grid; grid-template-columns: 56px repeat(5,1fr); border-bottom: 1px solid rgba(255,255,255,0.06); }
  .cal-time { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; color: rgba(242,242,238,0.4); display: flex; align-items: center; justify-content: center; padding: 2px; }
  .cal-cell { border: none; border-left: 1px solid rgba(255,255,255,0.09); height: 26px; padding: 0 4px; cursor: pointer; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; letter-spacing: 0.04em; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; text-align: left; transition: opacity .1s; }
  .cal-cell:hover { opacity: 0.8; }

  /* Detail panel */
  .detail-panel { border: 1px solid #9fb7a4; border-radius: 6px; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
  .detail-wa { border: 1px solid rgba(255,255,255,0.3); padding: 12px 20px; border-radius: 999px; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; transition: .2s; }
  .detail-wa:hover { background: #f2f2ee; color: #0a0a0a; }
  .btn-text-danger { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: rgba(242,242,238,0.6); font-family: inherit; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; padding: 12px 20px; border-radius: 999px; cursor: pointer; transition: color .2s; }
  .btn-text-danger:hover { color: #f2f2ee; }
  .btn-ghost-sm { background: transparent; border: none; color: rgba(242,242,238,0.4); font-family: inherit; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; padding: 12px 6px; cursor: pointer; transition: color .2s; }
  .btn-ghost-sm:hover { color: #f2f2ee; }

  /* Appointment cards */
  .appt-card { border: 1px solid rgba(255,255,255,0.14); border-radius: 6px; padding: 20px; display: flex; flex-direction: column; gap: 14px; transition: opacity .2s; }
  .badge { font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 600; padding: 7px 12px; border-radius: 999px; white-space: nowrap; }
  .btn-pill { background: transparent; border: 1px solid rgba(255,255,255,0.25); color: #f2f2ee; font-family: inherit; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; padding: 11px 18px; border-radius: 999px; cursor: pointer; transition: .2s; }
  .btn-pill:hover { background: #f2f2ee; color: #0a0a0a; }
  .btn-pill-faint { background: transparent; border: 1px solid rgba(255,255,255,0.14); color: rgba(242,242,238,0.5); font-family: inherit; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; padding: 11px 18px; border-radius: 999px; cursor: pointer; transition: color .2s; }
  .btn-pill-faint:hover { color: #f2f2ee; }
  .wa-link { border: 1px solid rgba(255,255,255,0.25); padding: 11px 18px; border-radius: 999px; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; transition: .2s; }
  .wa-link:hover { background: #f2f2ee; color: #0a0a0a; }

  /* Manual form */
  .manual-form { border: 1px dashed rgba(255,255,255,0.2); border-radius: 6px; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
  .form-input { background: transparent; border: none; border-bottom: 1px solid rgba(255,255,255,0.25); color: #f2f2ee; font-family: 'Work Sans', sans-serif; font-size: 15px; padding: 9px 0; outline: none; width: 100%; }
  .form-input::placeholder { color: rgba(242,242,238,0.35); }
  .btn-add { background: #9fb7a4; color: #0a0a0a; border: none; padding: 13px 24px; border-radius: 999px; font-family: inherit; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 600; cursor: pointer; transition: opacity .2s; align-self: flex-start; }
  .btn-add:hover { opacity: 0.85; }

  /* Logout */
  .btn-logout { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: rgba(242,242,238,0.6); font-family: inherit; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; padding: 10px 16px; border-radius: 999px; cursor: pointer; transition: .2s; }
  .btn-logout:hover { color: #f2f2ee; border-color: #f2f2ee; }

  /* Low-slot alerts */
  .alert-chips { display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; -ms-overflow-style:none; scrollbar-width:none; }
  .alert-chips::-webkit-scrollbar { display:none; }
  .alert-chip { flex-shrink:0; display:flex; align-items:center; gap:10px; background:rgba(196,169,107,0.08); border:1px solid rgba(196,169,107,0.28); border-radius:6px; padding:10px 14px; }
  .alert-chip-day { font-family:'Bebas Neue',sans-serif; font-size:20px; line-height:1; letter-spacing:0.06em; color:#c4a96b; }
  .alert-chip-count { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; letter-spacing:0.14em; text-transform:uppercase; color:rgba(196,169,107,0.65); white-space:nowrap; }

  /* Day chips (admin) */
  .day-chip { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:12px 6px 14px; border:1px solid rgba(255,255,255,0.18); border-radius:6px; background:transparent; color:#f2f2ee; cursor:pointer; transition:border-color .15s,background .15s,color .15s; min-width:0; }
  .day-chip.selected { background:#f2f2ee; color:#0a0a0a; border-color:#f2f2ee; }
  .day-chip-name { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:9px; letter-spacing:0.16em; text-transform:uppercase; }
  .day-chip-date { font-family:'Bebas Neue',sans-serif; font-size:26px; line-height:1; letter-spacing:0.04em; }
  .day-dot { width:5px; height:5px; border-radius:50%; margin-top:2px; }

  /* Admin slot list */
  .admin-slot { width:100%; display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius:6px; border:none; font-family:inherit; cursor:pointer; transition:opacity .15s; text-align:left; }
  .admin-slot-free   { background:rgba(242,242,238,0.07); border:1px solid rgba(255,255,255,0.12); }
  .admin-slot-free:hover { background:rgba(242,242,238,0.12); }
  .admin-slot-booked { background:#9fb7a4; }
  .admin-slot-booked:hover { opacity:0.88; }
  .admin-slot-closed { background:transparent; opacity:0.2; cursor:default; }
  .admin-slot-time   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; letter-spacing:0.1em; color:rgba(242,242,238,0.55); flex-shrink:0; }
  .admin-slot-booked .admin-slot-time { color:rgba(10,10,10,0.6); }
  .admin-slot-label  { font-size:14px; font-weight:500; color:#f2f2ee; }
  .admin-slot-booked .admin-slot-label { color:#0a0a0a; }
  .admin-slot-free   .admin-slot-label { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:rgba(242,242,238,0.35); }
  .admin-slot-sub    { font-size:12px; color:rgba(10,10,10,0.55); margin-left:auto; white-space:nowrap; }
</style>
</head>
<body style="background:#0a0a0a;color:#f2f2ee;min-height:100vh">

<!-- PASSWORD -->
<div id="view-password" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;padding:40px 24px">
  <div style="display:flex;flex-direction:column;align-items:center;gap:16px">
    <span style="width:64px;height:64px;border-radius:999px;background:#0a0a0a;border:1px solid rgba(255,255,255,0.35);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:0.06em;line-height:1">QC</span>
    <span style="font-family:'Bebas Neue',sans-serif;font-size:44px;letter-spacing:0.12em;line-height:1">QCORTESANO</span>
    <span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;letter-spacing:0.24em;color:rgba(242,242,238,0.45);text-transform:uppercase">Panel de turnos</span>
  </div>
  <div style="display:flex;flex-direction:column;gap:14px;width:100%;max-width:360px">
    <input id="pwd-input" class="form-input" type="password" placeholder="Contraseña" style="font-size:18px;padding:14px 0;letter-spacing:0.08em" onkeydown="if(event.key==='Enter')checkPassword()" />
    <p id="pwd-error" style="margin:0;font-size:12px;color:#c4a96b;display:none">Contraseña incorrecta.</p>
    <button onclick="checkPassword()" style="background:#f2f2ee;color:#0a0a0a;border:none;padding:16px;border-radius:6px;font-family:'Work Sans',sans-serif;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;font-weight:600;cursor:pointer;transition:opacity .2s" onmouseover="this.style.opacity='.85'" onmouseout="this.style.opacity='1'">Ingresar</button>
  </div>
</div>

<!-- LOGIN -->
<div id="view-login" style="min-height:100vh;display:none;flex-direction:column;align-items:center;justify-content:center;gap:44px;padding:40px 24px">
  <div style="display:flex;flex-direction:column;align-items:center;gap:16px">
    <span style="width:64px;height:64px;border-radius:999px;background:#0a0a0a;border:1px solid rgba(255,255,255,0.35);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:0.06em;line-height:1">QC</span>
    <span style="font-family:'Bebas Neue',sans-serif;font-size:44px;letter-spacing:0.12em;line-height:1">QCORTESANO</span>
    <span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;letter-spacing:0.24em;color:rgba(242,242,238,0.45);text-transform:uppercase">Panel de turnos</span>
  </div>
  <div style="display:flex;flex-direction:column;gap:14px;width:100%;max-width:360px">
    <button class="login-btn" onclick="login('valen')">
      <span style="display:flex;flex-direction:column;gap:5px">
        <span style="font-family:'Bebas Neue',sans-serif;font-size:32px;line-height:1;letter-spacing:0.04em">Valen</span>
        <span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;letter-spacing:0.18em;color:rgba(242,242,238,0.45);text-transform:uppercase">Fundador</span>
      </span>
      <span style="font-size:18px">→</span>
    </button>
    <button class="login-btn" onclick="login('alex')">
      <span style="display:flex;flex-direction:column;gap:5px">
        <span style="font-family:'Bebas Neue',sans-serif;font-size:32px;line-height:1;letter-spacing:0.04em">Alex</span>
        <span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;letter-spacing:0.18em;color:rgba(242,242,238,0.45);text-transform:uppercase">Peluquero</span>
      </span>
      <span style="font-size:18px">→</span>
    </button>
    <p style="margin:6px 0 0;font-size:12px;color:rgba(242,242,238,0.4);line-height:1.6">Cada barbero ve y gestiona únicamente su propia agenda.</p>
  </div>
</div>

<!-- DASHBOARD -->
<div id="view-dash" style="display:none;min-height:100vh;display:none;flex-direction:column">

  <!-- Header -->
  <header style="position:sticky;top:0;z-index:40;background:rgba(10,10,10,0.9);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,0.12)">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 20px">
      <div style="display:flex;align-items:center;gap:12px">
        <span style="width:36px;height:36px;border-radius:999px;border:1px solid rgba(255,255,255,0.35);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:17px;line-height:1">QC</span>
        <span style="display:flex;flex-direction:column">
          <span id="hdr-name" style="font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:0.08em;line-height:1"></span>
          <span id="hdr-role" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9px;letter-spacing:0.18em;color:rgba(242,242,238,0.4);text-transform:uppercase"></span>
        </span>
      </div>
      <button class="btn-logout" onclick="logout()">Salir</button>
    </div>
    <div style="display:flex;gap:6px;padding:0 20px 12px">
      <button id="tab-cal" class="tab-btn active" onclick="setTab('cal')">Calendario</button>
      <button id="tab-list" class="tab-btn" onclick="setTab('list')">Turnos</button>
      <button id="tab-svc" class="tab-btn" onclick="setTab('svc')">Servicios</button>
      <button id="tab-cfg" class="tab-btn" onclick="setTab('cfg')">Ajustes</button>
    </div>
  </header>

  <!-- CALENDAR VIEW -->
  <div id="view-cal" style="padding:18px 20px 120px;display:flex;flex-direction:column;gap:16px">

    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
      <button class="nav-arrow" onclick="weekOffset(-1)">←</button>
      <span id="week-label" style="font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:0.06em;line-height:1;text-align:center"></span>
      <button class="nav-arrow" onclick="weekOffset(+1)">→</button>
    </div>

    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between">
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button id="day-btn" class="paint-btn">Cerrar este día</button>
        <button id="paint-btn" class="paint-btn">Bloquear horarios</button>
      </div>
      <div style="display:flex;gap:14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9px;letter-spacing:0.14em;color:rgba(242,242,238,0.45);text-transform:uppercase;align-items:center">
        <span style="display:flex;align-items:center;gap:6px"><span style="width:11px;height:11px;background:rgba(242,242,238,0.16);box-shadow:inset 0 0 0 1px rgba(242,242,238,0.42);border-radius:2px"></span>libre</span>
        <span style="display:flex;align-items:center;gap:6px"><span style="width:11px;height:11px;background:#9fb7a4;border-radius:2px"></span>turno</span>
        <span style="display:flex;align-items:center;gap:6px"><span style="width:11px;height:11px;background:#0a0a0a;border:1px solid rgba(255,255,255,0.12);border-radius:2px"></span>cerrado</span>
      </div>
    </div>

    <!-- Low-slot alert banner -->
    <div id="low-alert" style="display:none;flex-direction:column;gap:8px">
      <span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:#c4a96b">⚡ Pocos cupos</span>
      <div id="low-alert-chips" class="alert-chips"></div>
    </div>

    <p id="help-text" style="margin:0;font-size:12px;line-height:1.6;color:rgba(242,242,238,0.45)"></p>

    <!-- Day chips -->
    <div id="admin-days" style="display:flex;gap:8px"></div>
    <!-- Slot list -->
    <div id="admin-slots" style="display:flex;flex-direction:column;gap:6px"></div>

    <div id="detail-panel" style="display:none"></div>
  </div>

  <!-- LIST VIEW -->
  <div id="view-list" style="display:none;padding:18px 20px 140px;flex-direction:column;gap:16px">
    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px">
      <h2 style="font-family:'Bebas Neue',sans-serif;font-size:40px;line-height:1;letter-spacing:0.03em;margin:0">Turnos</h2>
      <span id="count-label" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;letter-spacing:0.16em;color:rgba(242,242,238,0.45)"></span>
    </div>
    <div id="appt-list"></div>
    <!-- Manual form -->
    <div class="manual-form">
      <span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9px;letter-spacing:0.2em;color:rgba(242,242,238,0.45);text-transform:uppercase">Cargar turno manual</span>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px">
        <input id="new-name" class="form-input" placeholder="Nombre" />
        <input id="new-phone" class="form-input" placeholder="WhatsApp" />
        <input id="new-when" class="form-input" placeholder="Mié 19 · 17:00" />
      </div>
      <button class="btn-add" onclick="addAppt()">Agregar</button>
    </div>
  </div>

  <!-- SERVICES VIEW -->
  <div id="view-svc" style="display:none;padding:18px 20px 140px;flex-direction:column;gap:16px">
    <div style="display:flex;align-items:baseline;gap:12px">
      <h2 style="font-family:'Bebas Neue',sans-serif;font-size:40px;line-height:1;letter-spacing:0.03em;margin:0">Servicios</h2>
    </div>
    <div id="svc-list" style="display:flex;flex-direction:column;gap:8px"></div>
    <div class="manual-form" style="margin-top:8px">
      <span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9px;letter-spacing:0.2em;color:rgba(242,242,238,0.45);text-transform:uppercase">Agregar servicio</span>
      <div style="display:grid;grid-template-columns:1fr;gap:12px">
        <input id="new-svc-name"  class="form-input" placeholder="Nombre" />
        <input id="new-svc-dur"   class="form-input" placeholder="Duración (ej: 30 min)" />
        <input id="new-svc-mins"  class="form-input" placeholder="Minutos" type="number" min="5" />
        <input id="new-svc-price" class="form-input" placeholder="Precio (ej: $13.000)" />
      </div>
      <button class="btn-add" onclick="addService()">Agregar</button>
    </div>
  </div>

  <!-- SETTINGS VIEW -->
  <div id="view-cfg" style="display:none;padding:18px 20px 140px;flex-direction:column;gap:16px">
    <h2 style="font-family:'Bebas Neue',sans-serif;font-size:40px;line-height:1;letter-spacing:0.03em;margin:0">Ajustes</h2>
    <div class="manual-form">
      <span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9px;letter-spacing:0.2em;color:rgba(242,242,238,0.45);text-transform:uppercase">Cambiar contraseña</span>
      <input id="pwd-current" class="form-input" type="password" placeholder="Contraseña actual" />
      <input id="pwd-new"     class="form-input" type="password" placeholder="Nueva contraseña" />
      <input id="pwd-confirm" class="form-input" type="password" placeholder="Repetir nueva contraseña" />
      <p id="pwd-change-error" style="margin:0;font-size:12px;color:#c4a96b;display:none"></p>
      <p id="pwd-change-ok"    style="margin:0;font-size:12px;color:#9fb7a4;display:none">Contraseña actualizada.</p>
      <button class="btn-add" onclick="changePassword()">Guardar</button>
    </div>
  </div>

  <!-- Status bar -->
  <div style="position:fixed;left:0;right:0;bottom:0;z-index:50;padding:14px 20px 18px;background:linear-gradient(180deg,rgba(10,10,10,0) 0%,rgba(10,10,10,0.95) 40%);display:flex;justify-content:center;pointer-events:none">
    <span id="status-bar" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9px;letter-spacing:0.18em;color:rgba(242,242,238,0.45);text-transform:uppercase;text-align:center"></span>
  </div>
</div>

<script>
const DAYS   = ['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'];
const MONTHS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

// Horario base Valen: mar–mié 10–13 y 16–20, jue–sáb 10–20 (en minutos desde medianoche)
const VALEN = { 2:[[600,780],[960,1200]], 3:[[600,780],[960,1200]], 4:[[600,1200]], 5:[[600,1200]], 6:[[600,1200]] };
const ALEX  = { 2:[[600,780],[960,1200]], 3:[[600,780],[960,1200]], 4:[[600,1200]], 5:[[600,1200]], 6:[[600,1200]] };

function hhmm(m){ const h = Math.floor(m/60), mm = m%60; return (h<10?'0':'')+h+':'+(mm<10?'0':'')+mm; }
function cellKey(dayIdx, min){ return dayIdx + '|' + min; }

// Estado global
let configPassword = null; // cargado desde Firebase; null = usa default hardcoded

const S = {
  user: null,         // 'valen' | 'alex'
  tab: 'cal',
  week: 0,
  paint: false,
  detail: null,       // appt id
  dayIdx: 1,
  appts: [],
  fbBookings: [],
  fbServices: null,
  fbBlockedDays: {},
  fbBlockedSlots: {},
  newName: '', newPhone: '', newWhen: ''
};

const FB_URL         = 'https://qcortesano-9aa75-default-rtdb.firebaseio.com/bookings.json';
const FB_SVC_URL     = 'https://qcortesano-9aa75-default-rtdb.firebaseio.com/services';
const FB_BLOCKED_URL = 'https://qcortesano-9aa75-default-rtdb.firebaseio.com/blockedDays';
const FB_SLOTS_URL   = 'https://qcortesano-9aa75-default-rtdb.firebaseio.com/blockedSlots';
const FB_CONFIG_URL  = 'https://qcortesano-9aa75-default-rtdb.firebaseio.com/config';

const DEFAULT_SERVICES = {
  corte: { id:'corte', name:'Corte de pelo', duration:'30 min', mins:30, price:'$13.000', order:0 },
  combo: { id:'combo', name:'Corte + Barba', duration:'30 min', mins:30, price:'$16.000', order:1 },
  barba: { id:'barba', name:'Solo Barba',    duration:'30 min', mins:30, price:'$3.000',  order:2 },
  color: { id:'color', name:'Colorimetría',  duration:'30 min', mins:30, price:'A consultar', order:3 }
};

function computedFbAppts() {
  const start = weekStart();
  return S.fbBookings.map(b => {
    const parts = b.isoDate.split('-').map(Number);
    const bd = new Date(parts[0], parts[1] - 1, parts[2]);
    const day = Math.round((bd - start) / 864e5);
    return { ...b, day, owner: b.barber };
  }).filter(b => b.day >= 1 && b.day <= 5);
}

function allAppts() { return [...S.appts, ...computedFbAppts()]; }

function loadBlockedData() {
  Promise.all([
    fetch(FB_BLOCKED_URL + '.json').then(r => r.json()).then(data => { S.fbBlockedDays = data || {}; }).catch(() => {}),
    fetch(FB_SLOTS_URL + '.json').then(r => r.json()).then(data => { S.fbBlockedSlots = data || {}; }).catch(() => {})
  ]).then(() => { if (S.user) render(); });
}

function loadAdminServices() {
  fetch(FB_SVC_URL + '.json')
    .then(r => r.json())
    .then(data => {
      if (!data || Object.keys(data).length === 0) {
        S.fbServices = Object.values(DEFAULT_SERVICES);
        fetch(FB_SVC_URL + '.json', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(DEFAULT_SERVICES)
        }).catch(() => {});
      } else {
        S.fbServices = Object.values(data).filter(Boolean).sort((a, b) => (a.order||0) - (b.order||0));
      }
      if (S.tab === 'svc') renderServicesTab();
    })
    .catch(() => { S.fbServices = Object.values(DEFAULT_SERVICES); });
}

function isDayBlocked(dayIdx) {
  const d = new Date(weekStart()); d.setDate(d.getDate() + dayIdx);
  const iso = d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
  return !!((S.fbBlockedDays[S.user] || {})[iso]);
}

function toggleDay(dayIdx) {
  const d = new Date(weekStart()); d.setDate(d.getDate() + dayIdx);
  const iso = d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
  const userBlocked = Object.assign({}, S.fbBlockedDays[S.user] || {});
  if (userBlocked[iso]) delete userBlocked[iso]; else userBlocked[iso] = true;
  S.fbBlockedDays = Object.assign({}, S.fbBlockedDays, { [S.user]: userBlocked });
  fetch(FB_BLOCKED_URL + '/' + S.user + '.json', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(userBlocked)
  }).catch(() => {});
  render();
}

function toggleSlot(dayIdx, min) {
  const d = new Date(weekStart()); d.setDate(d.getDate() + dayIdx);
  const iso = d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
  const key = iso + '|' + min;
  const userSlots = Object.assign({}, S.fbBlockedSlots[S.user] || {});
  if (userSlots[key]) delete userSlots[key]; else userSlots[key] = true;
  S.fbBlockedSlots = Object.assign({}, S.fbBlockedSlots, { [S.user]: userSlots });
  fetch(FB_SLOTS_URL + '/' + S.user + '.json', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(userSlots)
  }).catch(() => {});
}

function renderServicesTab() {
  const list = document.getElementById('svc-list');
  if (!list) return;
  const svcs = S.fbServices || [];
  if (svcs.length === 0) {
    list.innerHTML = '<p style="font-size:13px;color:rgba(242,242,238,0.4)">No hay servicios cargados.</p>';
    return;
  }
  list.innerHTML = svcs.map(svc => `
    <div style="display:flex;flex-direction:column;gap:10px;padding:16px 18px;border:1px solid rgba(255,255,255,0.14);border-radius:6px">
      <div style="display:flex;flex-direction:column;gap:3px">
        <span style="font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:0.03em;line-height:1">${svc.name}</span>
        <span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9px;letter-spacing:0.14em;color:rgba(242,242,238,0.4);text-transform:uppercase">${svc.duration}</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <input class="form-input" value="${svc.price}" style="flex:1;font-size:13px;padding:6px 0"
          onblur="updateServicePrice('${svc.id}', this.value)"
          onkeydown="if(event.key==='Enter')this.blur()" />
        <button class="btn-text-danger" style="flex-shrink:0" onclick="deleteService('${svc.id}')">Eliminar</button>
      </div>
    </div>`).join('');
}

function updateServicePrice(id, price) {
  const svc = (S.fbServices || []).find(s => s.id === id);
  if (!svc || svc.price === price.trim()) return;
  svc.price = price.trim();
  fetch(FB_SVC_URL + '/' + id + '.json', {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ price: price.trim() })
  }).catch(() => {});
}

function deleteService(id) {
  S.fbServices = (S.fbServices || []).filter(s => s.id !== id);
  fetch(FB_SVC_URL + '/' + id + '.json', { method: 'DELETE' }).catch(() => {});
  renderServicesTab();
}

function addService() {
  const name  = document.getElementById('new-svc-name').value.trim();
  if (!name) return;
  const dur   = document.getElementById('new-svc-dur').value.trim() || '30 min';
  const mins  = parseInt(document.getElementById('new-svc-mins').value) || 30;
  const price = document.getElementById('new-svc-price').value.trim() || 'A consultar';
  const id    = 'svc_' + Date.now();
  const order = (S.fbServices || []).length;
  const svc   = { id, name, duration: dur, mins, price, order };
  S.fbServices = [...(S.fbServices || []), svc];
  fetch(FB_SVC_URL + '/' + id + '.json', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(svc)
  }).catch(() => {});
  ['new-svc-name','new-svc-dur','new-svc-mins','new-svc-price'].forEach(id => {
    document.getElementById(id).value = '';
  });
  renderServicesTab();
}

function loadFirebaseBookings() {
  fetch(FB_URL)
    .then(r => r.json())
    .then(data => {
      if (!data) { S.fbBookings = []; }
      else { S.fbBookings = Object.entries(data).filter(([,b]) => b && b.status !== 'cancelado').map(([k,b]) => ({ ...b, _fbKey: k })); }
      if (S.user) render();
    })
    .catch(() => {});
}

function weekStart() {
  const d = new Date();
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + S.week * 7);
  return d;
}

function isOpen(dayIdx, dow, min) {
  const d = new Date(weekStart()); d.setDate(d.getDate() + dayIdx);
  const iso = d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
  const schedule = S.user === 'valen' ? VALEN : ALEX;
  if ((S.fbBlockedDays[S.user] || {})[iso]) return false;
  if ((S.fbBlockedSlots[S.user] || {})[iso + '|' + min]) return false;
  return (schedule[dow] || []).some(r => min >= r[0] && min < r[1]);
}

// ── LOGIN / LOGOUT ──────────────────────────────────────────────
function login(user) {
  S.user  = user;
  S.tab   = 'cal';
  S.paint = false;
  S.detail = null;
  S.week  = 0;
  document.getElementById('view-login').style.display = 'none';
  const dash = document.getElementById('view-dash');
  dash.style.display = 'flex';
  loadFirebaseBookings();
  loadBlockedData();
  loadAdminServices();
  if (!S._poll) S._poll = setInterval(loadFirebaseBookings, 30000);
  render();
}

function logout() {
  S.user  = null;
  S.detail = null;
  document.getElementById('view-dash').style.display = 'none';
  document.getElementById('view-login').style.display = 'flex';
}

// ── TABS ────────────────────────────────────────────────────────
function setTab(tab) {
  S.tab = tab;
  S.detail = null;
  document.getElementById('tab-cal').classList.toggle('active', tab === 'cal');
  document.getElementById('tab-list').classList.toggle('active', tab === 'list');
  document.getElementById('tab-svc').classList.toggle('active', tab === 'svc');
  document.getElementById('tab-cfg').classList.toggle('active', tab === 'cfg');
  document.getElementById('view-cal').style.display  = tab === 'cal'  ? 'flex' : 'none';
  document.getElementById('view-list').style.display = tab === 'list' ? 'flex' : 'none';
  document.getElementById('view-svc').style.display  = tab === 'svc'  ? 'flex' : 'none';
  document.getElementById('view-cfg').style.display  = tab === 'cfg'  ? 'flex' : 'none';
  if (tab === 'svc') renderServicesTab();
  render();
}

// ── WEEK NAV ────────────────────────────────────────────────────
function weekOffset(d) {
  S.week  += d;
  S.detail = null;
  render();
}

// ── PAINT ───────────────────────────────────────────────────────
function togglePaint() { S.paint = !S.paint; render(); }

// ── MANUAL FORM ─────────────────────────────────────────────────
function addAppt() {
  const name = document.getElementById('new-name').value.trim();
  if (!name) return;
  const phone = document.getElementById('new-phone').value.trim() || 'sin número';
  const when  = document.getElementById('new-when').value.trim()  || 'Corte de pelo · 30 min';
  S.appts.push({ id: Date.now(), day:2, min:660, dur:30, name, phone, service: when, owner: S.user, status:'manual' });
  document.getElementById('new-name').value  = '';
  document.getElementById('new-phone').value = '';
  document.getElementById('new-when').value  = '';
  render();
}

// ── APPOINTMENT ACTIONS ──────────────────────────────────────────
function toggleStatus(id) {
  const a = S.appts.find(x => x.id === id);
  if (!a) return;
  a.status = a.status === 'manual' ? 'online' : 'manual';
  render();
}
function cancelAppt(id) {
  const a = S.appts.find(x => x.id === id);
  if (a) {
    a.status = a.status === 'cancelado' ? 'online' : 'cancelado';
    render();
    return;
  }
  const fbIdx = S.fbBookings.findIndex(x => x.id === id);
  if (fbIdx !== -1) {
    const fb = S.fbBookings[fbIdx];
    S.fbBookings.splice(fbIdx, 1);
    if (fb._fbKey) {
      fetch('https://qcortesano-9aa75-default-rtdb.firebaseio.com/bookings/' + fb._fbKey + '.json', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: 'cancelado' })
      }).catch(() => {});
    }
    render();
  }
}
function cancelFromDetail() {
  if (!S.detail) return;
  cancelAppt(S.detail);
  S.detail = null;
  render();
}
function closeDetail() { S.detail = null; renderCalendar(); renderDetail(); }

// ── RENDER ───────────────────────────────────────────────────────
function render() {
  const isAlex = S.user === 'alex';

  // Header
  document.getElementById('hdr-name').textContent = isAlex ? 'Alex' : 'Valen';
  document.getElementById('hdr-role').textContent = isAlex ? 'Peluquero' : 'Fundador';

  // Day-close button (ambos peluqueros)
  const db = document.getElementById('day-btn');
  const dayBlocked = isDayBlocked(S.dayIdx);
  db.textContent = dayBlocked ? 'Abrir este día' : 'Cerrar este día';
  db.classList.toggle('active', dayBlocked);
  db.onclick = () => toggleDay(S.dayIdx);

  // Paint / slot-block button (ambos peluqueros)
  const pb = document.getElementById('paint-btn');
  pb.textContent = S.paint ? 'Bloqueando horarios' : 'Bloquear horarios';
  pb.classList.toggle('active', S.paint);
  pb.onclick = togglePaint;

  // Help text
  document.getElementById('help-text').textContent =
    'Usá "Cerrar este día" para bloquear el día completo, o activá "Bloquear horarios" para cerrar franjas individuales.';

  // Week label
  const start = weekStart();
  document.getElementById('week-label').textContent = 'Semana del ' + start.getDate() + ' ' + MONTHS[start.getMonth()];

  renderAlerts();
  renderCalendar();
  renderDetail();
  renderList();
  renderStatusBar();
}

// Umbral: días con 3 o menos cupos libres disparan la alerta
const LOW_THRESHOLD = 3;

function renderAlerts() {
  const wrap  = document.getElementById('low-alert');
  const chips = document.getElementById('low-alert-chips');
  const start = weekStart();
  const mine  = allAppts().filter(a => a.owner === S.user && a.status !== 'cancelado');

  const lowDays = [];
  for (let i = 1; i <= 5; i++) {
    const d   = new Date(start); d.setDate(d.getDate() + i);
    const dow = d.getDay();
    let free = 0;
    for (let m = 600; m < 1200; m += 30) {
      const hasAppt = mine.some(a => a.day === i && m >= a.min && m < a.min + a.dur);
      if (!hasAppt && isOpen(i, dow, m)) free++;
    }
    if (free > 0 && free <= LOW_THRESHOLD) {
      lowDays.push({ label: DAYS[dow] + ' ' + d.getDate(), free });
    }
  }

  if (lowDays.length === 0) { wrap.style.display = 'none'; return; }

  wrap.style.display = 'flex';
  chips.innerHTML = lowDays.map(({ label, free }) => `
    <div class="alert-chip">
      <span class="alert-chip-day">${label}</span>
      <span class="alert-chip-count">${free} libre${free === 1 ? '' : 's'}</span>
    </div>`).join('');
}

function selectAdminDay(i) {
  S.dayIdx = i;
  S.detail = null;
  renderCalendar();
  renderDetail();
}

function renderCalendar() {
  const start    = weekStart();
  const mine     = allAppts().filter(a => a.owner === S.user && a.status !== 'cancelado');
  const schedule = S.user === 'valen' ? VALEN : ALEX;

  // ── Day chips ──
  const daysEl = document.getElementById('admin-days');
  const days = [];
  for (let i = 1; i <= 5; i++) {
    const d = new Date(start); d.setDate(d.getDate() + i);
    days.push({ i, d, dow: d.getDay() });
  }
  daysEl.innerHTML = days.map(({ i, d, dow }) => {
    const on       = S.dayIdx === i;
    const hasAppt  = mine.some(a => a.day === i);
    const blocked  = isDayBlocked(i);
    const dotColor = on ? '#0a0a0a' : '#9fb7a4';
    return `<button class="day-chip${on ? ' selected' : ''}" onclick="selectAdminDay(${i})" style="${blocked ? 'opacity:0.38' : ''}">
      <span class="day-chip-name">${DAYS[dow]}</span>
      <span class="day-chip-date">${d.getDate()}</span>
      <span class="day-dot" style="background:${hasAppt ? dotColor : 'transparent'}"></span>
    </button>`;
  }).join('');

  // ── Slots for selected day ──
  const slotsEl = document.getElementById('admin-slots');
  const sel = days.find(x => x.i === S.dayIdx);
  if (!sel) { slotsEl.innerHTML = ''; return; }

  const d2 = new Date(start); d2.setDate(d2.getDate() + S.dayIdx);
  const iso = d2.getFullYear() + '-' + (d2.getMonth()+1) + '-' + d2.getDate();
  const dayIsBlocked = isDayBlocked(S.dayIdx);

  let html = '';
  for (let m = 600; m < 1200; m += 30) {
    const open  = isOpen(S.dayIdx, sel.dow, m);
    const appt  = mine.find(a => a.day === S.dayIdx && m >= a.min && m < a.min + a.dur);
    const isFirstSlot = appt && m === appt.min;
    const inSchedule  = (schedule[sel.dow] || []).some(r => m >= r[0] && m < r[1]);
    const slotManuallyBlocked = !dayIsBlocked && inSchedule && !open;

    if (appt) {
      html += `<button class="admin-slot admin-slot-booked" onclick="slotClick(${S.dayIdx},${m})">
        <span class="admin-slot-time">${hhmm(m)}</span>
        <span class="admin-slot-label">${isFirstSlot ? appt.name : '·'}</span>
        ${isFirstSlot ? `<span class="admin-slot-sub">${appt.service.split('·')[0].trim()}</span>` : ''}
      </button>`;
    } else if (open) {
      html += `<button class="admin-slot admin-slot-free" onclick="slotClick(${S.dayIdx},${m})">
        <span class="admin-slot-time">${hhmm(m)}</span>
        <span class="admin-slot-label">Libre</span>
        ${S.paint ? '<span class="admin-slot-sub" style="color:rgba(242,242,238,0.3)">toca para bloquear</span>' : ''}
      </button>`;
    } else if (slotManuallyBlocked && S.paint) {
      html += `<button class="admin-slot admin-slot-closed" onclick="slotClick(${S.dayIdx},${m})" style="opacity:0.55;cursor:pointer">
        <span class="admin-slot-time">${hhmm(m)}</span>
        <span class="admin-slot-label" style="color:rgba(242,242,238,0.5)">Bloqueado</span>
        <span class="admin-slot-sub" style="color:rgba(242,242,238,0.3)">toca para abrir</span>
      </button>`;
    } else {
      html += `<button class="admin-slot admin-slot-closed" disabled>
        <span class="admin-slot-time">${hhmm(m)}</span>
        <span class="admin-slot-label" style="color:rgba(242,242,238,0.3)">${inSchedule ? 'Bloqueado' : 'Cerrado'}</span>
      </button>`;
    }
  }
  slotsEl.innerHTML = html;
}

function slotClick(dayIdx, m) {
  if (S.paint && isDayBlocked(dayIdx)) return;
  const mine = allAppts().filter(a => a.owner === S.user && a.status !== 'cancelado');
  const appt = mine.find(a => a.day === dayIdx && m >= a.min && m < a.min + a.dur);
  if (appt) { S.detail = appt.id; renderDetail(); return; }
  if (S.paint) { toggleSlot(dayIdx, m); renderCalendar(); }
}

function renderDetail() {
  const panel = document.getElementById('detail-panel');
  if (!S.detail) { panel.style.display = 'none'; return; }
  const appt  = allAppts().find(a => a.id === S.detail);
  if (!appt)   { panel.style.display = 'none'; return; }

  const start = weekStart();
  const d = new Date(start); d.setDate(d.getDate() + appt.day);
  const when = DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' · ' + hhmm(appt.min);
  const wa   = 'https://wa.me/54' + appt.phone.replace(/\s/g, '');

  panel.style.display = 'flex';
  panel.className = 'detail-panel';
  panel.style.flexDirection = 'column';
  panel.style.gap = '12px';
  panel.innerHTML = `
    <span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9px;letter-spacing:0.2em;color:rgba(242,242,238,0.5);text-transform:uppercase">${when}</span>
    <span style="font-family:'Bebas Neue',sans-serif;font-size:34px;line-height:1;letter-spacing:0.03em">${appt.name}</span>
    <span style="font-size:14px;color:rgba(242,242,238,0.7)">${appt.service}</span>
    <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:8px">
      <a href="${wa}" target="_blank" class="detail-wa">${appt.phone}</a>
      <button class="btn-text-danger" onclick="cancelFromDetail()">Cancelar turno</button>
      <button class="btn-ghost-sm" onclick="closeDetail()">Cerrar</button>
    </div>`;
}

function renderList() {
  const start = weekStart();
  const mine  = allAppts().filter(a => a.owner === S.user);
  const active = mine.filter(a => a.status !== 'cancelado').length;

  document.getElementById('count-label').textContent = active + (active === 1 ? ' activo' : ' activos');

  const list = document.getElementById('appt-list');
  list.innerHTML = '';
  list.style.display = 'flex';
  list.style.flexDirection = 'column';
  list.style.gap = '12px';

  mine.forEach(appt => {
    const d = new Date(start); d.setDate(d.getDate() + appt.day);
    const cancelled = appt.status === 'cancelado';
    const st = cancelled ? 'Cancelado' : appt.status === 'manual' ? 'Manual' : 'Online';
    const wa = 'https://wa.me/54' + appt.phone.replace(/\s/g, '');
    const when = DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' · ' + hhmm(appt.min);

    let badgeBorder = cancelled ? 'rgba(255,255,255,0.2)' : '#9fb7a4';
    let badgeBg     = cancelled ? 'transparent' : (appt.status === 'manual' ? 'transparent' : '#9fb7a4');
    let badgeFg     = cancelled ? 'rgba(242,242,238,0.5)' : (appt.status === 'manual' ? '#f2f2ee' : '#0a0a0a');

    const card = document.createElement('div');
    card.className = 'appt-card';
    card.style.opacity = cancelled ? '0.45' : '1';
    card.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px">
        <div style="display:flex;flex-direction:column;gap:5px">
          <span style="font-family:'Bebas Neue',sans-serif;font-size:30px;line-height:1;letter-spacing:0.03em;text-decoration:${cancelled?'line-through':'none'}">${appt.name}</span>
          <span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;letter-spacing:0.14em;color:rgba(242,242,238,0.5)">${when}</span>
        </div>
        <span class="badge" style="border:1px solid ${badgeBorder};background:${badgeBg};color:${badgeFg}">${st}</span>
      </div>
      <span style="font-size:13px;color:rgba(242,242,238,0.6)">${appt.service}</span>
      <div style="display:flex;flex-wrap:wrap;gap:9px">
        <a href="${wa}" target="_blank" class="wa-link">${appt.phone}</a>
        <button class="btn-pill" onclick="toggleStatus(${appt.id})">${appt.status === 'manual' ? 'Marcar online' : 'Marcar manual'}</button>
        <button class="btn-pill-faint" onclick="cancelAppt(${appt.id})">${cancelled ? 'Restaurar' : 'Cancelar'}</button>
      </div>`;
    list.appendChild(card);
  });
}

function renderStatusBar() {
  const active = allAppts().filter(a => a.owner === S.user && a.status !== 'cancelado').length;
  document.getElementById('status-bar').textContent =
    active + (active === 1 ? ' turno esta semana' : ' turnos esta semana') + ' · cambios visibles al instante para los clientes';
}

// ── PASSWORD ────────────────────────────────────────────────────
function checkPassword() {
  const val     = document.getElementById('pwd-input').value;
  const err     = document.getElementById('pwd-error');
  const correct = configPassword || atob('VmFsZW5zYW5vMTA=');
  if (val === correct) {
    document.getElementById('view-password').style.display = 'none';
    document.getElementById('view-login').style.display = 'flex';
    err.style.display = 'none';
  } else {
    err.style.display = 'block';
    document.getElementById('pwd-input').value = '';
    document.getElementById('pwd-input').focus();
  }
}

function changePassword() {
  const current  = document.getElementById('pwd-current').value;
  const newPwd   = document.getElementById('pwd-new').value.trim();
  const confirm  = document.getElementById('pwd-confirm').value;
  const correct  = configPassword || atob('VmFsZW5zYW5vMTA=');
  const errEl    = document.getElementById('pwd-change-error');
  const okEl     = document.getElementById('pwd-change-ok');
  errEl.style.display = 'none';
  okEl.style.display  = 'none';
  if (current !== correct) { errEl.textContent = 'La contraseña actual es incorrecta.'; errEl.style.display = 'block'; return; }
  if (newPwd.length < 6)   { errEl.textContent = 'La nueva contraseña debe tener al menos 6 caracteres.'; errEl.style.display = 'block'; return; }
  if (newPwd !== confirm)  { errEl.textContent = 'Las contraseñas no coinciden.'; errEl.style.display = 'block'; return; }
  configPassword = newPwd;
  fetch(FB_CONFIG_URL + '/password.json', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(newPwd)
  }).catch(() => {});
  document.getElementById('pwd-current').value = '';
  document.getElementById('pwd-new').value     = '';
  document.getElementById('pwd-confirm').value = '';
  okEl.style.display = 'block';
}

fetch(FB_CONFIG_URL + '/password.json').then(r => r.json()).then(d => { if (d && typeof d === 'string') configPassword = d; }).catch(() => {});
// Asegurar que las vistas empiecen ocultas
document.getElementById('view-list').style.display = 'none';
document.getElementById('view-cal').style.display  = 'flex';
document.getElementById('view-svc').style.display  = 'none';
document.getElementById('view-cfg').style.display  = 'none';
</script>
